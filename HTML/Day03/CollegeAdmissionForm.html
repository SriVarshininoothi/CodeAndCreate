<!DOCTYPE html>
<html lang="en">

<head>
    <title>College Admission Form</title>

<body>
    <h1>College Admission Form</h1>
    <form>
        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter student name....">
        <br><br>

        <label for="fatherName">Father's Name</label>
        <input type="text" id="fatherName" placeholder="Enter father's name....">
        <br><br>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number....">
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email....">
        <br><br>


        <label for="course">Course selection</label>
        <select>
            <option value="">Select a course</option>
            <option>Nursing</option>
            <option>MBBS</option>
            <option>BDS</option>
            <option>PhD</option>
        </select>
        <br><br>
        <textarea id="address" placeholder="Enter your address...." rows="4" cols="40"></textarea>
        <br><br>
        <button type="submit">Submit</button>
    </form>

</body>
</head>

</html>
