<!DOCTYPE html>
<html lang="en">

<head>
    <title>SpiceVilla</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contact-card">
        <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">

            <div class="container-fluid">

                <!-- LOGO -->

                <a class="navbar-brand" href="#">
                    SPICEVILLA
                </a>

                <!-- MOBILE MENU BUTTON -->

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- NAVBAR LINKS -->

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">

                        <li class="nav-item mx-2">

                            <a class="nav-link" href="./index.html">
                                Home
                            </a>

                        </li>

                        <li class="nav-item mx-2">

                            <a class="nav-link" href="./menu.html">
                                Menu
                            </a>

                        </li>

                        <li class="nav-item mx-2">

                            <a class="nav-link" href="./about.html">
                                About
                            </a>

                        </li>

                        <li class="nav-item mx-2">

                            <a class="nav-link" href="./contact.html">
                                Contact
                            </a>

                        </li>

                        <!-- BUTTON -->

                        <li class="nav-item mx-2">

                            <button class="book-btn">
                                Book a Table
                            </button>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

        <!-- Hero section -->

        <section class="contact-hero">

            <div class="container">

                <div class="row align-items-center">

                    <!-- LEFT SIDE -->

                    <div class="col-lg-6 contact-text">

                        <h1>Contact Us</h1>

                        <p>
                            We'd love to hear from you.
                            Feel free to contact SpiceVilla
                            for reservations and queries.
                        </p>

                        <div class="contact-info">

                            <h5>📍 Hyderabad,Telangana</h5>

                            <h5>📞 +91 9876543210</h5>

                            <h5>✉ spicevilla@gmail.com</h5>

                            <h5>🕒 Mon - Sun : 10AM - 10PM</h5>

                        </div>

                    </div>


                    <!-- RIGHT SIDE -->

                    <div class="col-lg-6">

                        <div class="contact-form">

                            <input type="text" placeholder="Enter Your Name" class="form-control mb-3">

                            <input type="email" placeholder="Enter Your Email" class="form-control mb-3">

                            <input type="text" placeholder="Enter Your Phone Number" class="form-control mb-3">

                            <textarea rows="5" placeholder="Your Message" class="form-control mb-3"></textarea>

                            <button class="send-btn">
                                Send Message
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
